databaseChangeLog:
  - changeSet:
      id: 001-create-events
      author: siva
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: venue
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: event_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-create-seats
      author: siva
      changes:
        - createTable:
            tableName: seats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_seats_event
                    references: events(id)
              - column:
                  name: row_label
                  type: VARCHAR(5)
                  constraints:
                    nullable: false
              - column:
                  name: seat_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: AVAILABLE
                  constraints:
                    nullable: false
              - column:
                  name: hold_expires_at
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            tableName: seats
            columnNames: event_id, row_label, seat_number
            constraintName: uq_seat_per_event